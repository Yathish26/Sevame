    <script>
      // Firefox repaints blur filters / backdrop-filters far more expensively than Chromium.
      // Flag it before first paint so index.css can serve a lighter visual path.
      if (/firefox/i.test(navigator.userAgent)) {
        var root = document.documentElement
        root.classList.add('is-firefox')
        // While scrolling: pause decorative animations and ignore hover, so cards sliding
        // under the cursor don't trigger hover lifts/shadow repaints mid-scroll.
        var scrollTimer = 0
        window.addEventListener(
          'scroll',
          function () {
            if (!scrollTimer) root.classList.add('is-scrolling')
            else clearTimeout(scrollTimer)
            scrollTimer = setTimeout(function () {
              scrollTimer = 0
              root.classList.remove('is-scrolling')
            }, 120)
          },
          { passive: true }
        )
      }
    </script>
